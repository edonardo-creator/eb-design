 const place=(s,x,y,w,h)=>{const nf=[];s.free.forEach(f=>{if(x>=f.x+f.w||x+w<=f.x||y>=f.y+f.h||y+h<=f.y){nf.push(f);return}

   if(y>f.y)nf.push({x:f.x,y:f.y,w:f.w,h:y-f.y});if(y+h<f.y+f.h)nf.push({x:f.x,y:y+h,w:f.w,h:f.y+f.h-y-h})});
  s.free=nf.filter((a,i)=>!nf.some((b,j)=>j!==i&&a.x>=b.x&&a.y>=b.y&&a.x+a.w<=b.x+b.w&&a.y+a.h<=b.y+b.h&&(j<i||a.x!=b.x||a.y!=b.y||a.w!=b.w||a.h!=b.h)))};
 items.sort((a,b)=>Math.max(b.L,b.W)-Math.max(a.L,a.W)||b.L*b.W-a.L*a.W);
 for(const it of items){let best=null;
  const opts=[[it.L,it.W,0]];if(it.rot)opts.push([it.W,it.L,1]);
  sheets.forEach((s,si)=>s.free.forEach(f=>opts.forEach(([pw,ph,r])=>{const w=pw+kerf,h=ph+kerf;if(fits(f,w,h)){const sc=Math.min(f.w-w,f.h-h),sc2=Math.max(f.w-w,f.h-h);if(!best||sc<best.sc||(sc==best.sc&&sc2<best.sc2))best={si,x:f.x,y:f.y,w,h,r,sc,sc2}}})));
  if(!best){const s={free:[{x:0,y:0,w:SW+kerf,h:SH+kerf}],parts:[]};let ok=null;
   for(const [pw,ph,r] of opts){const w=pw+kerf,h=ph+kerf;if(fits(s.free[0],w,h)){ok={x:0,y:0,w,h,r};break}}
   if(!ok){over.push(it);continue}sheets.push(s);best={si:sheets.length-1,...ok}}
  const s=sheets[best.si];place(s,best.x,best.y,best.w,best.h);s.parts.push({...it,x:best.x,y:best.y,w:best.w-kerf,h:best.h-kerf,r:best.r})}
 return{sheets,over}}
function matCalc(){const M=matS(),{P,glass}=matParts(),SW=M.SW-2*M.trim,SH=M.SH-2*M.trim,kerf=M.kerf/10,sheetA=M.SW*M.SH/1e4;
 const expand=list=>{const o=[];list.forEach(p=>{for(let i=0;i<p.q;i++)o.push({...p,q:1})});return o};
 const grp=(keyf)=>{const g={};P.forEach(p=>{const k=keyf(p);(g[k]=g[k]||[]).push(p)});return g};
 const byCat={},cats=['govde','kapak','arkalik','raf'];
 cats.forEach(c=>{const ps=P.filter(p=>p.cat==c),cols={};ps.forEach(p=>{const k=p.col+'|'+p.t;(cols[k]=cols[k]||[]).push(p)});
  let n=0,a=0,sh=0;const det=Object.entries(cols).map(([k,l])=>{const [col,th]=k.split('|'),r=maxrects(expand(l),SW,SH,kerf),ar=l.reduce((s,p)=>s+p.L*p.W*p.q,0)/1e4,cnt=l.reduce((s,p)=>s+p.q,0);n+=cnt;a+=ar;sh+=r.sheets.length;return{col,th:+th,cnt,ar,sheets:r.sheets.length}});
  byCat[c]={n,a,sh,det}});
 const mats=grp(p=>p.col+'|'+p.t),order=[];
 Object.entries(mats).forEach(([k,l])=>{const [col,th]=k.split('|'),r=maxrects(expand(l),SW,SH,kerf),ar=l.reduce((s,p)=>s+p.L*p.W*p.q,0)/1e4;
  order.push({col,th:+th,cats:[...new Set(l.map(p=>CATN[p.cat]))].join(', '),cnt:l.reduce((s,p)=>s+p.q,0),ar,sheets:r.sheets,over:r.over,fire:r.sheets.length?1-ar/(r.sheets.length*sheetA):0})});
 order.sort((a,b)=>b.th-a.th||b.ar-a.ar);
 const band={};P.forEach(p=>{const len=(p.bl*p.L+p.bw*p.W)*p.q;if(!len)return;const ty=p.cat=='kapak'?'k':'g',k=ty+'|'+p.col;band[k]=(band[k]||0)+len});
 const bands=Object.entries(band).map(([k,len])=>{const [ty,col]=k.split('|');return{ty,col,m:len/100,mf:len/100*(1+M.bf/100)}}).sort((a,b)=>a.ty.localeCompare(b.ty)||b.m-a.m);
 const painted=P.some(p=>p.cat=='kapak'&&p.n!='Baza'&&p.bl==0&&p.bw==0);
 MATR={P,glass,byCat,order,bands,sheetA,painted};return MATR}
const cn=h=>h==matS().gc&&!COLORS.some(c=>c[1]==h)?'Gövde rengi':nm(COLORS,h);
const f2=n=>(+n).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
function sheetSVG(s,M,idx){const SW=M.SW,SH=M.SH,tr=M.trim,sc=1;let o=`<svg viewBox="-2 -2 ${SW+4} ${SH+4}" role="img" aria-label="Tabaka ${idx} kesim planı" style="width:100%;display:block;background:var(--panel);border-radius:4px"><rect x="0" y="0" width="${SW}" height="${SH}" fill="#f1efe8" stroke="#8a8f93" stroke-width=".6"/>`;
 const pal=['#cfe0ec','#e5d6c1','#d6e5cf','#e9d3d8','#dcd6ea','#efe5bf'],ci={govde:0,kapak:1,arkalik:2,raf:3};
 s.parts.forEach(p=>{const x=tr+p.x,y=tr+p.y,w=p.w,h=p.h;o+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${pal[ci[p.cat]]}" stroke="#4b5257" stroke-width=".35"/>`;
  const lab=p.n,dim=`${Math.round(p.r?p.W*10:p.L*10)}×${Math.round(p.r?p.L*10:p.W*10)}`,vert=h>w*1.3,span=vert?h:w,thick=vert?w:h,chars=Math.max(lab.length,dim.length);
  let f=Math.min(6,(span-2)/(chars*.56),(thick-1)/2.3);if(f>=2){const cx=x+w/2,cy=y+h/2,tr=vert?` transform="rotate(-90 ${cx} ${cy})"`:'';o+=`<g${tr}><text x="${cx}" y="${cy-f*.15}" text-anchor="middle" font-size="${f}" fill="#22272b">${esc(lab)}</text><text x="${cx}" y="${cy+f*.95}" text-anchor="middle" font-size="${f*.85}" fill="#4b5257">${dim}</text></g>`}});
 return o+`</svg>`}
function matCSV(){const R=MATR||matCalc(),rows=[['Kategori','Renk','Kalınlık (mm)','Parça','Modül','Boy (mm)','En (mm)','Adet','Damar yönünde','Bant boy kenar','Bant en kenar']];
 R.P.forEach(p=>rows.push([CATN[p.cat],cn(p.col),p.t,p.n,p.mod,Math.round(p.L*10),Math.round(p.W*10),p.q,p.rot?'Hayır':'Evet',p.bl,p.bw]));
 return '﻿'+rows.map(r=>r.map(v=>{v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\r\n')}
async function matSaveCSV(){const st=$('#mts');try{await saveFile(`kesim-listesi-${(S.cust||S.proj||'mutfak').replace(/[^\wçğıöşüÇĞİÖŞÜ-]+/g,'-')}.csv`,new Blob([matCSV()],{type:'text/csv'}));if(st)st.textContent='Kesim listesi kaydedildi.'}catch(e){if(st)st.textContent=saveErr(e,'Bu görünümde dosya kaydı kullanılamıyor. "Listeyi kopyala" ile kopyalayabilirsin.')}}
function matSet(k,v){const M=matS();M[k]=v;MATR=null;R()}
function pMat(){const M=matS(),R0=matCalc(),inp=(l,k,v,st)=>`<label class="f">${l}<input type="number" inputmode="decimal" step="${st||'any'}" value="${v}" onchange="matSet('${k}',Math.max(0,+this.value||0))"></label>`;
 const tot=R0.order.reduce((a,o)=>a+o.sheets.length,0);
 let h=`<p class="note">Malzeme listesi çizimdeki modüllerden otomatik çıkar. Parçalar tabakaya en az fireyle yerleştirilir (aynı renk ve kalınlık birlikte kesilir, ahşap desenlerde damar yönü korunur).</p>`;
 h+=`<div class="qr"><div class="qh"><b>Toplam tabaka</b><span>${M.SW}×${M.SH} cm</span></div><div class="tot" style="margin:4px 0">${tot} tabaka</div><p class="mu" style="margin:0">${R0.P.reduce((a,p)=>a+p.q,0)} parça · ${f2(R0.P.reduce((a,p)=>a+p.L*p.W*p.q,0)/1e4)} m² net</p></div>`;
 h+=`<h3 class="sec">Kategoriye göre</h3><div style="overflow-x:auto"><table class="mt"><thead><tr><th>Kategori</th><th>Renk · kalınlık</th><th>Parça</th><th>m²</th><th>Tabaka*</th></tr></thead><tbody>`;
 ['govde','kapak','arkalik','raf'].forEach(c=>{const b=R0.byCat[c];if(!b.n){h+=`<tr><td><b>${CATN[c]}</b></td><td class="mu">—</td><td>0</td><td>0</td><td>0</td></tr>`;return}
  b.det.forEach((d,i)=>{h+=`<tr><td>${i?'':`<b>${CATN[c]}</b>`}</td><td>${cn(d.col)} · ${d.th} mm</td><td>${d.cnt}</td><td>${f2(d.ar)}</td><td>${d.sheets}</td></tr>`})});
 h+=`</tbody></table></div><p class="note">* Kategori ayrı kesilirse gereken tabaka. Gövde ve raf aynı malzemeyse birlikte kesildiğinde daha az tabaka gerekir, sipariş için aşağıdaki tabloyu kullan.</p>`;
 h+=`<h3 class="sec">Sipariş edilecek tabaka</h3><div style="overflow-x:auto"><table class="mt"><thead><tr><th>Malzeme</th><th>Kullanım</th><th>Parça</th><th>m²</th><th>Tabaka</th><th>Fire</th></tr></thead><tbody>`+R0.order.map(o=>`<tr><td><b>${cn(o.col)}</b><br><span class="mu">${o.th} mm MDF</span></td><td>${o.cats}</td><td>${o.cnt}</td><td>${f2(o.ar)}</td><td><b>${o.sheets.length}</b></td><td>%${Math.round(o.fire*100)}</td></tr>`).join('')+`</tbody></table></div>`;
 if(R0.order.some(o=>o.over.length))h+=`<p class="note bad">Tabakaya sığmayan parça var: ${R0.order.flatMap(o=>o.over).map(p=>`${p.n} ${Math.round(p.L*10)}×${Math.round(p.W*10)} mm`).join(', ')}. Tabaka ölçüsünü veya modülü kontrol et.</p>`;
 h+=`<h3 class="sec">PVC kenar bandı</h3><div style="overflow-x:auto"><table class="mt"><thead><tr><th>Bant</th><th>Renk</th><th>Net</th><th>Fireli (+%${M.bf})</th></tr></thead><tbody>`+(R0.bands.length?R0.bands.map(b=>`<tr><td>${b.ty=='k'?'Kapak bandı 1–2 mm':'Gövde bandı 0,8 mm'}</td><td>${cn(b.col)}</td><td>${f2(b.m)} m</td><td><b>${f2(b.mf)} m</b></td></tr>`).join(''):`<tr><td colspan="4" class="mu">Bantlanacak kenar yok.</td></tr>`)+`</tbody></table></div>`;
 if(R0.painted)h+=`<p class="note">Lake Kapak modelleri boyalı kenarlı üretildiği için kapak bandı hesabına katılmadı.</p>`;
 if(R0.glass.length)h+=`<p class="note">Cam: ${R0.glass.reduce((a,g)=>a+g.q,0)} adet, toplam ${f2(R0.glass.reduce((a,g)=>a+g.W*g.H*g.q,0)/1e4)} m²${R0.glass.some(g=>!g.cam)?' (alüminyum çerçeveli kapaklar MDF hesabına girmez)':''}.</p>`;
 h+=`<div class="row" style="margin-top:8px"><button class="chip on" onclick="matSaveCSV()">Kesim listesini kaydet (CSV)</button><button class="chip" onclick="MATO.list=!MATO.list;R()">${MATO.list?'Parça listesini gizle':'Parça listesini göster'}</button></div><p class="note" id="mts"></p>`;
 if(MATO.list)h+=`<div style="overflow-x:auto;max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:6px"><table class="mt"><thead><tr><th>Parça</th><th>Ölçü (mm)</th><th>Adet</th><th>Malzeme</th><th>Bant</th><th>Modül</th></tr></thead><tbody>`+R0.P.map(p=>`<tr><td>${CATN[p.cat]} · ${esc(p.n)}</td><td>${Math.round(p.L*10)}×${Math.round(p.W*10)}</td><td>${p.q}</td><td>${cn(p.col)} ${p.t}</td><td>${p.bl||p.bw?`${p.bl}U ${p.bw}K`:'—'}</td><td class="mu">${esc(p.mod)}</td></tr>`).join('')+`</tbody></table></div><p class="note">Bant: U = uzun (boy) kenar, K = kısa (en) kenar sayısı.</p>`;
 h+=`<h3 class="sec">Kesim planı</h3>`+R0.order.map((o,oi)=>{const op=MATO['p'+oi];return `<div class="qr"><button class="sxh" aria-expanded="${!!op}" onclick="MATO['p${oi}']=!MATO['p${oi}'];R()"><b>${cn(o.col)} · ${o.th} mm</b><span>${o.sheets.length} tabaka · fire %${Math.round(o.fire*100)} · ${op?'kapat':'aç'}</span></button>${op?o.sheets.map((s,si)=>`<p class="lb">Tabaka ${si+1} / ${o.sheets.length} · ${s.parts.length} parça</p>${sheetSVG(s,M,si+1)}`).join(''):''}</div>`}).join('')+`<p class="note">Renkler: mavi gövde, bej kapak, yeşil arkalık, pembe raf. Ölçüler mm.</p>`;
 h+=`<h3 class="sec">Hesap ayarları</h3><div class="g3">${inp('Tabaka boyu (cm)','SW',M.SW)}${inp('Tabaka eni (cm)','SH',M.SH)}${inp('Kenar payı (cm)','trim',M.trim)}${inp('Testere payı (mm)','kerf',M.kerf*10).replace("matSet('kerf',Math.max(0,+this.value||0))","matSet('kerf',Math.max(0,+this.value||0)/10)")}${inp('Gövde kalınlığı (mm)','tg',M.tg)}${inp('Kapak kalınlığı (mm)','tk',M.tk)}${inp('Arkalık kalınlığı (mm)','ta',M.ta)}${inp('Raf kalınlığı (mm)','tr',M.tr)}${inp('Bant firesi (%)','bf',M.bf)}<label class="f">Baza yüksekliği (cm)<input type="number" inputmode="decimal" step="any" value="${BZH()}" onchange="setHt('bz',this.value)"></label></div>
  <p class="lb">Gövde rengi: <b>${cn(M.gc)}</b></p><div class="row">${sw(COLORS,M.gc,"matSet('gc',")}</div>
  <p class="lb">Çekmece kutusu</p><div class="row">${[['ahsap','MDF (ahşap) kutu'],['metal','Metal yanaklı hazır sistem']].map(([a,b])=>`<button class="chip ${M.drw==a?'on':''}" onclick="matSet('drw','${a}')">${b}</button>`).join('')}</div>
  <label class="chk"><input type="checkbox" ${M.baza?'checked':''} onchange="matSet('baza',this.checked?1:0)"> Baza MDF'den (alt dolap renginde, ${BZH()} cm)</label>
  <p class="note">Varsayımlar: gövde derinliği modül derinliğinden 2 cm az, alt dolaplarda üst tabla yerine 2 adet 10 cm kuşak, arkalık gövde renginde, kapak aralıkları 3 mm. Açık raflı modüllerin gövdesi ve rafları ön renginde hesaplanır. Baza ve taç kapak grubunda sayılır. Buzdolabı üstü klapa dolap hesaba dahildir, buzdolabının kendisi ve tezgah girmez.</p>`;
 return h}
